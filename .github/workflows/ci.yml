name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the full lab pipeline
        run: python -m lab.pipeline
      - name: Tests
        env:
          LAB_LLM_BACKEND: extractive
        run: pytest -q
