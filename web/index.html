<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LIVE Experimentation Lab</title>
  <meta name="description" content="A/B testing, causal inference, uplift modelling and an AI copilot for a LIVE-streaming platform.">
  <link rel="stylesheet" href="styles.css">
  <script>try { if (localStorage.getItem("lx-theme") === "light") document.documentElement.classList.add("light"); } catch (e) {}</script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">LX</div>
      <div><div class="brand-name">LIVE Experimentation Lab</div><div class="brand-sub">Decisions from data</div></div>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-group">Overview</div>
      <a href="#/" data-route="overview"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>Portfolio</a>
      <div class="nav-group">Experiments</div>
      <div id="exp-links"></div>
      <div class="nav-group">Advanced methods</div>
      <a href="#/uplift" data-route="uplift"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 20h18"/><path d="M5 16l4-5 4 3 6-8"/><circle cx="19" cy="6" r="1.5"/></svg>Uplift (ML)</a>
      <a href="#/causal" data-route="causal"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><path d="M8.5 8.5l7 7"/><circle cx="18" cy="6" r="3"/><path d="M15 6H9"/></svg>Causal inference</a>
      <a href="#/monitor" data-route="monitor"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Monitor &amp; root cause<span class="count" id="alert-count"></span></a>
      <div class="nav-group">Tools</div>
      <a href="#/planner" data-route="planner"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h2M14 11h2M8 15h2M14 15h2"/></svg>Test planner</a>
      <a href="#/copilot" data-route="copilot"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>AI Copilot</a>
      <a href="#/trust" data-route="trust"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>Can we trust it?</a>
    </nav>
    <div class="sidebar-foot">Simulated LIVE platform data · 300k users · ground truth known</div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="crumbs" id="crumbs"></div>
      <form class="ask" id="ask-form" autocomplete="off">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/></svg>
        <input id="ask-input" placeholder="Ask the copilot: “Why didn’t we ship autoplay previews?”">
      </form>
      <button class="icon-btn" id="theme-btn" title="Toggle light / dark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </header>
    <section class="view" id="view"><div class="empty">Loading…</div></section>
  </main>
</div>
<script src="vendor/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
